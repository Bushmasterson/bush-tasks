name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "ci"
      - "dependencies"
  - title: "📖 Documentation"
    labels:
      - "documentation"
      - "docs"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
      - "chore"
      - "ci"
      - "dependencies"
      - "documentation"
  default: patch

autolabeler:
  - label: "feature"
    branch:
      - '/^feat(ure)?[/-].+/'
  - label: "fix"
    branch:
      - '/^fix[/-].+/'
  - label: "chore"
    branch:
      - '/^chore[/-].+/'
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
