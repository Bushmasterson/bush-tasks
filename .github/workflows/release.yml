name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-release -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build-release --config Release

      - name: Test
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Install
        run: cmake --install build-release --config Release --prefix install

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive
            -Path install\*
            -DestinationPath bush_tasks-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bush_tasks-${{ github.ref_name }}-windows.zip
