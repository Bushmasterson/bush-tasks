name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Windows ----------
          - os: windows-latest
            target: windows-amd64
            artifact: bush-tasks-windows-amd64.exe
            msystem: UCRT64
            mingw_pkg: mingw-w64-ucrt-x86_64-gcc
            cxx: g++

          - os: windows-latest
            target: windows-x86
            artifact: bush-tasks-windows-x86.exe
            msystem: MINGW32
            mingw_pkg: mingw-w64-i686-gcc
            cxx: g++

          # windows-arm64 собирается на ubuntu-latest через llvm-mingw:
          # MSYS2 CLANGARM64 даёт ARM64-бинарники компилятора, которые
          # не могут выполниться на x86_64-раннере windows-latest
          # (отсюда "Exec format error"). llvm-mingw сам запускается
          # на x86_64 Linux и кросс-компилирует под aarch64-w64-mingw32.
          - os: ubuntu-latest
            target: windows-arm64
            artifact: bush-tasks-windows-arm64.exe
            toolchain: llvm-mingw

          # ---------- Linux (native + cross) ----------
          - os: ubuntu-latest
            target: linux-amd64
            artifact: bush-tasks-linux-amd64
            cxx: g++
            static: full

          - os: ubuntu-latest
            target: linux-arm64
            artifact: bush-tasks-linux-arm64
            apt_pkg: g++-aarch64-linux-gnu
            cxx: aarch64-linux-gnu-g++
            static: libs

          - os: ubuntu-latest
            target: linux-386
            artifact: bush-tasks-linux-386
            apt_pkg: g++-multilib
            cxx: g++
            extra_flags: -m32
            static: full

          - os: ubuntu-latest
            target: linux-armv7
            artifact: bush-tasks-linux-armv7
            apt_pkg: g++-arm-linux-gnueabihf
            cxx: arm-linux-gnueabihf-g++
            static: libs

          - os: ubuntu-latest
            target: linux-riscv64
            artifact: bush-tasks-linux-riscv64
            apt_pkg: g++-riscv64-linux-gnu
            cxx: riscv64-linux-gnu-g++
            static: libs

          - os: ubuntu-latest
            target: linux-ppc64le
            artifact: bush-tasks-linux-ppc64le
            apt_pkg: g++-powerpc64le-linux-gnu
            cxx: powerpc64le-linux-gnu-g++
            static: libs

          - os: ubuntu-latest
            target: linux-s390x
            artifact: bush-tasks-linux-s390x
            apt_pkg: g++-s390x-linux-gnu
            cxx: s390x-linux-gnu-g++
            static: libs

          # ---------- macOS ----------
          - os: macos-latest
            target: macos-amd64
            artifact: bush-tasks-macos-amd64
            cxx: clang++
            extra_flags: -arch x86_64

          - os: macos-latest
            target: macos-arm64
            artifact: bush-tasks-macos-arm64
            cxx: clang++
            extra_flags: -arch arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain (Linux)
        if: runner.os == 'Linux' && matrix.apt_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_pkg }}

      - name: Install compiler (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.mingw_pkg }}

      - name: Build (Linux)
        if: runner.os == 'Linux' && matrix.toolchain != 'llvm-mingw'
        shell: bash
        run: |
          mkdir -p dist
          STATIC_FLAGS=""
          if [ "${{ matrix.static }}" = "full" ]; then
            STATIC_FLAGS="-static -static-libgcc -static-libstdc++"
          elif [ "${{ matrix.static }}" = "libs" ]; then
            STATIC_FLAGS="-static-libgcc -static-libstdc++"
          fi
          ${{ matrix.cxx }} -std=c++17 $STATIC_FLAGS ${{ matrix.extra_flags }} \
            -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks
          cp bush-tasks dist/${{ matrix.artifact }}

      - name: Install llvm-mingw (Windows ARM64 cross-toolchain)
        if: matrix.toolchain == 'llvm-mingw'
        run: |
          curl -L -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build (Windows ARM64 via llvm-mingw)
        if: matrix.toolchain == 'llvm-mingw'
        shell: bash
        run: |
          mkdir -p dist
          aarch64-w64-mingw32-clang++ -std=c++17 -static -static-libgcc -static-libstdc++ \
            -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks.exe
          cp bush-tasks.exe dist/${{ matrix.artifact }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ${{ matrix.cxx }} -std=c++17 ${{ matrix.extra_flags }} \
            -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks
          cp bush-tasks dist/${{ matrix.artifact }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          ${{ matrix.cxx }} -std=c++17 -static -static-libgcc -static-libstdc++ \
            -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks.exe
          cp bush-tasks.exe dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release and CHANGELOG
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            dist/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate CHANGELOG.md from all releases
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          for tag in $(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'); do
            date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
            body=$(gh release view "$tag" --json body --jq '.body')
            echo "## $tag ($date)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$body" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}" || echo "Nothing to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
