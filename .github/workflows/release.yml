name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            GOOS: windows
            GOARCH: amd64
            ext: .exe
          - os: windows-latest
            GOOS: windows
            GOARCH: arm64
            ext: .exe
          - os: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            ext: ""
          - os: ubuntu-latest
            GOOS: linux
            GOARCH: arm64
            ext: ""
          - os: ubuntu-latest
            GOOS: linux
            GOARCH: 386
            ext: ""
          - os: macos-latest
            GOOS: darwin
            GOARCH: amd64
            ext: ""
          - os: macos-latest
            GOOS: darwin
            GOARCH: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -ldflags="-s -w" -o dist/${{ github.event.repository.name }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}${{ matrix.ext }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: dist/*

  release:
    name: Create Release and CHANGELOG
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            dist/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate CHANGELOG.md from all releases
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          for tag in $(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'); do
            date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
            body=$(gh release view "$tag" --json body --jq '.body')
            echo "## $tag ($date)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$body" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}" || echo "Nothing to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release with new CHANGELOG
        run: |
          CHANGELOG_ENTRY=$(cat CHANGELOG.md | sed -n "/## ${{ github.ref_name }}/,/## /p" | head -n -1)
          gh release edit ${{ github.ref_name }} --body "$CHANGELOG_ENTRY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
