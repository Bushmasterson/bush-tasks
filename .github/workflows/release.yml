name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-latest

          - os: windows
            arch: x86
            runner: windows-latest

          - os: windows
            arch: arm64
            runner: windows-11-arm

          - os: linux
            arch: x64
            runner: ubuntu-latest

          - os: linux
            arch: x86
            runner: ubuntu-latest

          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: linux
            arch: armv7
            runner: ubuntu-24.04-arm

          - os: macos
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip" ./install/*
          else
            tar -czf "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C install .
          fi

      - name: Create or update Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            gh release upload "$TAG" \
              "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip" \
              --clobber
          else
            gh release upload "$TAG" \
              "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
              --clobber
          fi
