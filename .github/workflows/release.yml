name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-latest
          - os: windows
            arch: x86
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-11-arm
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: x86
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: linux
            arch: armv7
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: freebsd
            arch: x64
            runner: ubuntu-latest
          - os: freebsd
            arch: arm64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip" ./install/*
          else
            tar -czf "bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C install .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip
            bush_tasks-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
