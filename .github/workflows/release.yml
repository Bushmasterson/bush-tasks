name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.8.0). Tag must already exist in the repository."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  LLVM_MINGW_VERSION: "20240917"
  MACOS_X86_64_MIN: "10.13"
  MACOS_ARM64_MIN: "11.0"

jobs:
  # ================================================================
  # Build data - single source of truth
  # ================================================================
  build_data:
    name: Generate build data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.data.outputs.tag }}
      version: ${{ steps.data.outputs.version }}
      short_sha: ${{ steps.data.outputs.short_sha }}
      build_date: ${{ steps.data.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in the repository."
            exit 1
          fi
          VERSION="${TAG#v}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"   >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

  # ================================================================
  # Tests
  # ================================================================
  test:
    name: Run tests
    needs: build_data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build -j

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  # ================================================================
  # Prepare release
  # ================================================================
  prepare_release:
    name: Create GitHub Release
    needs: [build_data, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Skip notice
        if: needs.test.result != 'success'
        run: |
          echo "::warning::Tests did not pass (result: ${{ needs.test.result }}). Release will not be created."

      - name: Checkout
        if: needs.test.result == 'success'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        if: needs.test.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build_data.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping creation."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

  # ================================================================
  # Build matrix
  # ================================================================
  build:
    name: Build (${{ matrix.name }})
    needs: [build_data, prepare_release]
    if: always() && needs.prepare_release.result == 'success'
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            artifact: bush-tasks-linux-amd64
          - name: linux-i686
            os: ubuntu-latest
            artifact: bush-tasks-linux-i686
          - name: linux-arm64
            os: ubuntu-latest
            artifact: bush-tasks-linux-arm64
          - name: linux-armv7
            os: ubuntu-latest
            artifact: bush-tasks-linux-armv7
          - name: windows-amd64
            os: windows-latest
            artifact: bush-tasks-windows-amd64.exe
          - name: windows-x86
            os: windows-latest
            artifact: bush-tasks-windows-x86.exe
          - name: windows-arm64
            os: ubuntu-latest
            artifact: bush-tasks-windows-arm64.exe
          - name: macos-amd64
            os: macos-13
            artifact: bush-tasks-macos-amd64
          - name: macos-arm64
            os: macos-14
            artifact: bush-tasks-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (linux-amd64)
        if: matrix.name == 'linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Install toolchain (linux-i686)
        if: matrix.name == 'linux-i686'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build g++-multilib

      - name: Install toolchain (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-aarch64-linux-gnu

      - name: Install toolchain (linux-armv7)
        if: matrix.name == 'linux-armv7'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-arm-linux-gnueabihf

      - name: Setup MSYS2 (windows-amd64)
        if: matrix.name == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Setup MSYS2 (windows-x86)
        if: matrix.name == 'windows-x86'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Install llvm-mingw (windows-arm64)
        if: matrix.name == 'windows-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Ensure ninja (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: which ninja || brew install ninja

      - name: Build (linux-amd64)
        if: matrix.name == 'linux-amd64'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build -j

      - name: Build (linux-i686)
        if: matrix.name == 'linux-i686'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DBUSH_TASKS_BUILD_CLI=ON
          cmake --build build -j

      - name: Build (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build -j

      - name: Build (linux-armv7)
        if: matrix.name == 'linux-armv7'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7 \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build -j

      - name: Build (windows-amd64)
        if: matrix.name == 'windows-amd64'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build

      - name: Build (windows-x86)
        if: matrix.name == 'windows-x86'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build

      - name: Build (windows-arm64)
        if: matrix.name == 'windows-arm64'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-clang \
            -DCMAKE_CXX_COMPILER=aarch64-w64-mingw32-clang++ \
            -DBUSH_TASKS_BUILD_CLI=ON \
            -DBUSH_TASKS_STATIC=ON
          cmake --build build -j

      - name: Build (macos-amd64)
        if: matrix.name == 'macos-amd64'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_X86_64_MIN} \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF \
            -DBUSH_TASKS_BUILD_CLI=ON
          cmake --build build -j

      - name: Build (macos-arm64)
        if: matrix.name == 'macos-arm64'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_ARM64_MIN} \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF \
            -DBUSH_TASKS_BUILD_CLI=ON
          cmake --build build -j

      - name: Strip binary (macOS)
        if: startsWith(matrix.name, 'macos-')
        run: strip -x build/bush-tasks || true

      - name: Verify macOS slice (min OS version)
        if: startsWith(matrix.name, 'macos-')
        run: |
          set -euo pipefail
          BIN="build/bush-tasks"
          echo "=== otool -l (build version) ==="
          otool -l "$BIN" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" || true
          echo "=== file ==="
          file "$BIN"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            windows-*) SRC="build/bush-tasks.exe" ;;
            *)         SRC="build/bush-tasks" ;;
          esac
          DST="${{ matrix.artifact }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::Binary '$SRC' was not produced."
            ls -la build || true
            exit 1
          fi
          cp "$SRC" "$DST"
          SIZE=$(wc -c < "$DST")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Artifact '$DST' is suspiciously small ($SIZE bytes)."
            exit 1
          fi
          echo "Packaged: $DST ($SIZE bytes)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload to release
        if: ${{ !startsWith(matrix.name, 'macos-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.build_data.outputs.tag }}" \
            "${{ matrix.artifact }}" \
            --repo "${{ github.repository }}" \
            --clobber

  # ================================================================
  # macOS Universal - merge x86_64 + arm64 into a fat binary
  # ================================================================
  macos_universal:
    name: macOS Universal
    needs: [build_data, build]
    if: always()
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS binaries
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: macos-binaries

      - name: List downloaded files
        run: ls -la macos-binaries || true

      - name: Verify both binaries present
        id: verify_inputs
        run: |
          AMD="macos-binaries/bush-tasks-macos-amd64"
          ARM="macos-binaries/bush-tasks-macos-arm64"
          if [ ! -s "$AMD" ] || [ ! -s "$ARM" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cannot build universal binary - one or both macOS builds are missing."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect input slices
        if: steps.verify_inputs.outputs.present == 'true'
        run: |
          set -euo pipefail
          echo "=== x86_64 slice ==="
          lipo -info macos-binaries/bush-tasks-macos-amd64
          file macos-binaries/bush-tasks-macos-amd64
          otool -l macos-binaries/bush-tasks-macos-amd64 | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" || true
          echo ""
          echo "=== arm64 slice ==="
          lipo -info macos-binaries/bush-tasks-macos-arm64
          file macos-binaries/bush-tasks-macos-arm64
          otool -l macos-binaries/bush-tasks-macos-arm64 | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" || true

      - name: Create universal binary
        if: steps.verify_inputs.outputs.present == 'true'
        run: |
          set -euo pipefail
          lipo -create \
            macos-binaries/bush-tasks-macos-amd64 \
            macos-binaries/bush-tasks-macos-arm64 \
            -output bush-tasks-macos-universal
          chmod +x bush-tasks-macos-universal

      - name: Verify universal binary
        if: steps.verify_inputs.outputs.present == 'true'
        run: |
          set -euo pipefail
          BIN="bush-tasks-macos-universal"
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Universal binary is suspiciously small ($SIZE bytes)."
            exit 1
          fi
          ARCHS=$(lipo -archs "$BIN")
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -q "x86_64" || { echo "::error::Missing x86_64"; exit 1; }
          echo "$ARCHS" | grep -q "arm64"  || { echo "::error::Missing arm64";  exit 1; }

          echo "=== per-slice minimum OS versions ==="
          otool -l "$BIN" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" || true

          echo "=== file ==="
          file "$BIN"
          echo "OK: universal binary built ($SIZE bytes, $ARCHS)"

      - name: Ad-hoc code sign (optional but helps on some Macs)
        if: steps.verify_inputs.outputs.present == 'true'
        run: |
          codesign --force --sign - bush-tasks-macos-universal || true
          codesign -dv bush-tasks-macos-universal 2>&1 | head -20 || true

      - name: Upload to release
        if: steps.verify_inputs.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.build_data.outputs.tag }}" \
            bush-tasks-macos-universal \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Skip notice
        if: steps.verify_inputs.outputs.present != 'true'
        run: |
          {
            echo "### macOS Universal skipped"
            echo ""
            echo "One or both macOS binaries were missing. Universal binary was not created."
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # Verify release - checksums and asset presence
  # ================================================================
  verify_release:
    name: Verify release assets
    needs: [build_data, build, macos_universal]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.build_data.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --clobber || echo "::warning::Some assets could not be downloaded"
          ls -la dist || true

      - name: Report asset presence
        run: |
          set -uo pipefail
          REQUIRED=(
            "bush-tasks-linux-amd64"
            "bush-tasks-linux-i686"
            "bush-tasks-linux-arm64"
            "bush-tasks-linux-armv7"
            "bush-tasks-windows-amd64.exe"
            "bush-tasks-windows-x86.exe"
            "bush-tasks-windows-arm64.exe"
            "bush-tasks-macos-universal"
          )
          PRESENT=0
          MISSING=0
          {
            echo "### Release asset check"
            echo ""
            echo "| Asset | Status | Size |"
            echo "|---|---|---|"
            for f in "${REQUIRED[@]}"; do
              if [ -s "dist/$f" ]; then
                SIZE=$(wc -c < "dist/$f")
                echo "| $f | OK | $SIZE |"
                PRESENT=$((PRESENT + 1))
              else
                echo "::warning::Missing or empty asset: $f"
                echo "| $f | MISSING | - |"
                MISSING=$((MISSING + 1))
              fi
            done
            echo ""
            echo "Present: $PRESENT, Missing: $MISSING"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SHA256SUMS.txt
        run: |
          set -uo pipefail
          cd dist
          if ls bush-tasks-* >/dev/null 2>&1; then
            sha256sum bush-tasks-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "::warning::No assets to checksum"
          fi

      - name: Upload SHA256SUMS.txt
        if: hashFiles('dist/SHA256SUMS.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.build_data.outputs.tag }}" \
            dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber

  # ================================================================
  # Regenerate CHANGELOG.md
  # ================================================================
  changelog:
    name: Regenerate CHANGELOG.md
    needs: [build_data, verify_release]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild CHANGELOG.md from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Changelog"
            echo ""
            for TAG in $(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName'); do
              echo "## $TAG"
              echo ""
              gh release view "$TAG" --repo "${{ github.repository }}" --json body -q '.body'
              echo ""
            done
          } > CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes in CHANGELOG.md"
            exit 0
          fi
          git commit -m "chore: regenerate CHANGELOG.md"
          git push origin main || echo "::warning::Failed to push CHANGELOG.md (branch protection?)"
