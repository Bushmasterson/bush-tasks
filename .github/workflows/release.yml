name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bush-tasks
            test_name: test_core
            asset_name: bush-tasks-linux-amd64
            extra_flags: ""
          - os: macos-latest
            artifact_name: bush-tasks
            test_name: test_core
            asset_name: bush-tasks-macos-universal
            extra_flags: "-arch x86_64 -arch arm64"
          - os: windows-latest
            artifact_name: bush-tasks.exe
            test_name: test_core.exe
            asset_name: bush-tasks-windows-amd64.exe
            extra_flags: "-static -static-libgcc -static-libstdc++"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MinGW (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: g++ -std=c++17 ${{ matrix.extra_flags }} -Iinclude src/core.cpp tests/test_core.cpp -o ${{ matrix.test_name }}

      - name: Build tests (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: g++ -std=c++17 ${{ matrix.extra_flags }} -Iinclude src/core.cpp tests/test_core.cpp -o ${{ matrix.test_name }}

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ./${{ matrix.test_name }}

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./${{ matrix.test_name }}

      - name: Build project (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: g++ -std=c++17 ${{ matrix.extra_flags }} -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o ${{ matrix.artifact_name }}

      - name: Build project (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: g++ -std=c++17 ${{ matrix.extra_flags }} -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o ${{ matrix.artifact_name }}

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          body=$(gh api --method POST repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ github.ref_name }} --jq .body)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate CHANGELOG.md from all releases
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          for tag in $(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'); do
            date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
            body=$(gh release view "$tag" --json body --jq '.body')
            echo "## $tag ($date)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$body" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}" || echo "Nothing to commit"
          git push origin HEAD:main
