name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: bush-tasks-windows-amd64.exe
            command: g++ -std=c++17 -static -static-libgcc -static-libstdc++ -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks.exe
          - os: windows-latest
            artifact: bush-tasks-windows-x86.exe
            command: g++ -std=c++17 -static -static-libgcc -static-libstdc++ -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks.exe
          - os: windows-latest
            artifact: bush-tasks-windows-arm64.exe
            command: g++ -std=c++17 -static -static-libgcc -static-libstdc++ -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks.exe
          - os: ubuntu-latest
            artifact: bush-tasks-linux-amd64
            command: g++ -std=c++17 -static -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks
          - os: ubuntu-latest
            artifact: bush-tasks-linux-arm64
            command: g++ -std=c++17 -static -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks
          - os: ubuntu-latest
            artifact: bush-tasks-linux-386
            command: g++ -std=c++17 -static -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks
          - os: macos-latest
            artifact: bush-tasks-macos-amd64
            command: clang++ -std=c++17 -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks -arch x86_64
          - os: macos-latest
            artifact: bush-tasks-macos-arm64
            command: clang++ -std=c++17 -Iinclude src/main.cpp src/core.cpp src/cli.cpp -o bush-tasks -arch arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc

      - name: Install C++ compiler (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build project (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ${{ matrix.command }}
          cp bush-tasks dist/${{ matrix.artifact }}

      - name: Build project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          ${{ matrix.command }}
          cp bush-tasks.exe dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release and CHANGELOG
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            dist/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate CHANGELOG.md from all releases
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          for tag in $(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'); do
            date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt' | cut -d'T' -f1)
            body=$(gh release view "$tag" --json body --jq '.body')
            echo "## $tag ($date)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$body" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}" || echo "Nothing to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
