name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.adoc"
      - "LICENSE"
      - "LICENSE.*"
      - "NOTICE"
      - "CHANGELOG*"
      - "README*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".clang-format"
      - ".clang-format-ignore"
      - ".pre-commit-config.yaml"
      - ".pre-commit-hooks.yaml"
      - "docs/**"
      - "assets/**"
      - ".vscode/**"
      - ".idea/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.adoc"
      - "LICENSE"
      - "LICENSE.*"
      - "NOTICE"
      - "CHANGELOG*"
      - "README*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".clang-format"
      - ".clang-format-ignore"
      - ".pre-commit-config.yaml"
      - ".pre-commit-hooks.yaml"
      - "docs/**"
      - "assets/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Ensure ninja (macOS)
        if: matrix.os == 'macos-14'
        run: which ninja || brew install ninja

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build -j

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ASAN + UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Configure with sanitizers
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build --output-on-failure

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Auto-format C++ files
        run: |
          set -euo pipefail
          FILES=$(find src include tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) ! -name 'json.hpp' | sort)
          if [ -z "$FILES" ]; then
            echo "No C++ files to check."
            exit 0
          fi
          for f in $FILES; do
            clang-format -i --style=file "$f"
          done

      - name: Commit and push auto-format fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to format — all files already compliant."
            exit 0
          fi
          echo "Auto-formatting changed files:"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-format with clang-format"
          git push
          echo "::notice::clang-format auto-fixed formatting and pushed. Re-run checks to verify."

      - name: Warn on non-PR events
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet; then
            echo "::warning::Some files are not clang-format compliant. Run locally: clang-format -i on all .cpp/.h files."
          fi
