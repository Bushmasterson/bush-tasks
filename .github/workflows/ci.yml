name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.adoc"
      - "LICENSE"
      - "LICENSE.*"
      - "NOTICE"
      - "CHANGELOG*"
      - "README*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".clang-format"
      - ".clang-format-ignore"
      - ".pre-commit-config.yaml"
      - ".pre-commit-hooks.yaml"
      - "docs/**"
      - "assets/**"
      - ".vscode/**"
      - ".idea/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.adoc"
      - "LICENSE"
      - "LICENSE.*"
      - "NOTICE"
      - "CHANGELOG*"
      - "README*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".clang-format"
      - ".clang-format-ignore"
      - ".pre-commit-config.yaml"
      - ".pre-commit-hooks.yaml"
      - "docs/**"
      - "assets/**"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Ensure ninja (macOS)
        if: matrix.os == 'macos-14'
        run: which ninja || brew install ninja

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build -j

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ASAN + UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Configure with sanitizers
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUSH_TASKS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build --output-on-failure

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          set -euo pipefail
          FILES=$(find src include tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) ! -name 'json.hpp' | sort)
          if [ -z "$FILES" ]; then
            echo "No C++ files to check."
            exit 0
          fi
          FAILED=0
          for f in $FILES; do
            if ! diff -u "$f" <(clang-format --style=file "$f"); then
              echo "::error file=$f::File is not clang-format compliant"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Some files are not formatted. Run locally:"
            echo "::error::  clang-format -i src/*.cpp include/*.h tests/*.cpp"
            echo "::error::Or use pre-commit: py -m pre_commit run --all-files"
            exit 1
          fi
          echo "All C++ files are clang-format compliant."
